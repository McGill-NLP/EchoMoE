# Expert-parallel folded serving.
#
# FlashInfer, not FlashAttention: on one node at 2,048 offered requests the folded student serves
# 14,245 tok/s under FlashInfer and 3,363 under FlashAttention. The base model reaches 18,183. The
# base-model profile uses FlashInfer too, so folded and base scores come from the same attention.
#
# Capture mode is set per variant on the command line, not here. FULL and FULL_DECODE_ONLY capture
# in about the same time (312 s and 322 s at 1,024 offered requests, 23 s at 256): capture cost
# tracks the admission budget, not the mode.
kind: vllm_server
tensor_parallel_size: 1
data_parallel_size: 8
expert_parallel: true
all2all_backend: allgather_reducescatter
attention_backend: FLASHINFER
performance_mode: throughput
prefix_caching: true
eplb: false
