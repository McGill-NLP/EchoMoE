# A folded Gemma 4 26B-A4B export (`folded`): `base.yaml` with whole-model graphs on every batch,
# prefills included, as the reported student and the identity control were served.
kind: vllm_server
tensor_parallel_size: 1
data_parallel_size: 8
expert_parallel: true
all2all_backend: allgather_reducescatter
attention_backend: TRITON_ATTN
performance_mode: throughput
prefix_caching: true
eplb: false
cudagraph_mode: FULL
