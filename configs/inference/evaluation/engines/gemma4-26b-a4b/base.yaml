# Gemma 4 26B-A4B through vLLM's own model (`base-vllm`): the base-model profile on Triton attention.
# The five global layers have 512-wide heads, past FlashAttention's and FlashInfer's 256, and vLLM
# runs every layer on one backend.
kind: vllm_server
tensor_parallel_size: 1
data_parallel_size: 8
expert_parallel: true
all2all_backend: allgather_reducescatter
attention_backend: TRITON_ATTN
performance_mode: throughput
prefix_caching: true
eplb: false
