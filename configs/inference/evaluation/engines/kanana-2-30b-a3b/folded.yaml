# A folded Kanana-2-30B-A3B export (`folded`): `base.yaml` with whole-model graphs on every batch,
# prefills included, as the reported students and the identity control were served.
kind: vllm_server
tensor_parallel_size: 1
data_parallel_size: 8
expert_parallel: true
all2all_backend: allgather_reducescatter
attention_backend: FLASH_ATTN_MLA
performance_mode: throughput
prefix_caching: true
eplb: false
request_timeout_seconds: 21600
cudagraph_mode: FULL
