# Kanana-2-30B-A3B through vLLM's own model (`base-vllm`): the base-model profile on FlashAttention
# MLA, vLLM's first choice for multi-latent attention on H100.
#
# A capped generation decodes at about 2.2 tokens/s here, so a 16,384-token one takes about
# 7,400 s. Every reported Kanana-2 evaluation waited up to 21,600 s for a request.
kind: vllm_server
tensor_parallel_size: 1
data_parallel_size: 8
expert_parallel: true
all2all_backend: allgather_reducescatter
attention_backend: FLASH_ATTN_MLA
performance_mode: throughput
prefix_caching: true
eplb: false
request_timeout_seconds: 21600
