# A folded Moonlight-16B-A3B export (`folded`): `base.yaml` with whole-model graphs on every batch,
# prefills included, as the reported students and the identity control were served.
kind: vllm_server
tensor_parallel_size: 1
data_parallel_size: 8
expert_parallel: true
all2all_backend: allgather_reducescatter
attention_backend: FLASH_ATTN_MLA
performance_mode: throughput
prefix_caching: true
eplb: false
max_model_len: 8192
request_timeout_seconds: 7200
cudagraph_mode: FULL
