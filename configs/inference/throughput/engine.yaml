# vLLM engine and benchmark options of every throughput run, both variants (`vllm bench latency`,
# vLLM 0.29). The CLI adds the model, the workload, max_model_len (input + output), the seed
# (42 + rank) and the data-parallel size (one rank per launched GPU).
dtype: bfloat16
tensor_parallel_size: 1
gpu_memory_utilization: 0.9
enable_prefix_caching: false
disable_detokenize: true
async_scheduling: false
max_num_batched_tokens: 4096
enable_expert_parallel: true
all2all_backend: deepep_v2
distributed_executor_backend: external_launcher
# no torch.compile, and CUDA graphs for decode-only batches
compilation_config: {mode: 0, cudagraph_mode: FULL_DECODE_ONLY}
num_iters_warmup: 1
num_iters: 2
