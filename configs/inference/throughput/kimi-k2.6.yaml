# Kimi-K2.6 with random weights (Tables 37 and 38): the folded student's experts in group-32 INT4
# (W4A16, run on Marlin) as the base model's, dispatch rank 1792 and combine rank 3584 with a
# reference every 4 MoE layers (fixtures.py). The engine options override engine.yaml.
expert_format: int4_group32
engine:
  max_model_len: 8448
  max_num_batched_tokens: 2048
  gpu_memory_utilization: 0.95
  kv_cache_memory_bytes: 9663676416  # 9 GiB
  seed: 0
  compilation_config: {mode: 0, cudagraph_mode: FULL_DECODE_ONLY, cudagraph_capture_sizes: [1, 4, 16, 64, 128]}
  trust_remote_code: true
# the base model masks its padding rows' routes (fairness.py)
padding_route_mask: true
# prompt token ids, drawn uniformly from [low, high)
prompt_vocab: [1000, 160000]
# network contexts (QPs) each DeepEP buffer allocates
deepep_contexts: 65
# per-call backend times (selection.py) by the dispatch's and combine's precision: BF16,
# FP8 both (--fp8)
select:
  bf16: costs-kimi-k2.6-bf16.csv
  fp8: costs-kimi-k2.6-fp8.csv
