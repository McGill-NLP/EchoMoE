# Every prompt is prefilled whole: a chunked prefill splits a prompt the step cannot hold, and the
# split grows through Nemotron-H's near-tied sigmoid routes into another trajectory.
model_export: outputs/nemotron-3.5-lightning-30b-a3b/teacher/hf
tokenized_dataset: outputs/nemotron-3.5-lightning-30b-a3b/data/dolci/tokens
fit_layout: outputs/nemotron-3.5-lightning-30b-a3b/data/dolci/train
validation_layout: outputs/nemotron-3.5-lightning-30b-a3b/data/dolci/validation
output_root: outputs/nemotron-3.5-lightning-30b-a3b/capture
selection_seed: 42
fit_rows: 512000
validation_rows: 32768
max_tokens_per_document: 8
part_count: 24
rows_per_file: 4096
max_model_len: 8193
max_num_seqs: 256
max_num_batched_tokens: 16384
gpu_memory_utilization: 0.88
enable_chunked_prefill: false
